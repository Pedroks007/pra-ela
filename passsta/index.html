<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Ana ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <p class="status" id="statusText">Coração bloqueado (0/3)</p>

    <div class="heart-box" id="heartBox">
      <svg class="heart-svg" viewBox="0 0 32 29.6">
        <defs>
          <clipPath id="heartClip">
            <path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z"/>
          </clipPath>
        </defs>
        <path fill="rgba(255,255,255,0.14)" d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z"/>
        <rect id="heartFill" x="0" y="30" width="32" height="30" fill="#ff2a6d" clip-path="url(#heartClip)" />
      </svg>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="buttons" id="buttonGroup">
      <button data-step="1">1. Desbloquear meu sorriso</button>
      <button data-step="2" disabled>2. Desbloquear meu carinho</button>
      <button data-step="3" disabled>3. Revelar o segredo</button>
    </div>

    <div class="final-message" id="finalMessage">
      <h1 class="glow-text">Eu te amo, Ana!</h1>
      <p class="subtext">Você desbloqueou o meu coração por completo. ❤️</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
